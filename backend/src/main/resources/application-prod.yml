# Produção: Gmail SMTP com senha de app (plan D-24). Usuário e senha SÓ por variável de
# ambiente (MAIL_USERNAME, MAIL_PASSWORD); nunca no repositório.
spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    # Sem valor padrão em produção (T-021, D-11): a aplicação não sobe sem um JWT_SECRET real,
    # nunca comitado, igual ao padrão de MAIL_USERNAME/MAIL_PASSWORD acima.
    secret: ${JWT_SECRET}

logging:
  level:
    br.com.cuidamais: INFO
