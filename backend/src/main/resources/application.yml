# Configuração comum a todos os profiles. Valores sensíveis e de máquina vêm do `.env` na raiz
# (plan D-43): o Spring importa o arquivo como properties; o Docker Compose lê o mesmo arquivo.
spring:
  application:
    name: cuida-mais
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cuida}}
    username: ${POSTGRES_USER:cuida}
    password: ${POSTGRES_PASSWORD:cuida}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é do Flyway (D-06); o Hibernate só confere
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  jackson:
    time-zone: America/Sao_Paulo   # exibição (Constitution §5); armazenamento em UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # D-18/D-32/contrato: `servers: [{url: /api/v1}]` no openapi.yaml. Configurado uma única vez
    # aqui para que toda rota nasça no lugar certo sem prefixar cada @RequestMapping (T-020).
    context-path: /api/v1

app:
  mail:
    from: ${MAIL_FROM:Cuida+ <nao-responda@cuidamais.local>}
  jobs:
    # T-019 (plan D-09, R-06): um único @Scheduled, a cada 5 min, numa instância só; o profile test desliga
    enabled: ${JOBS_ENABLED:true}
    interval: ${JOBS_INTERVAL:PT5M}   # Duration ISO-8601 (fixedDelay)
