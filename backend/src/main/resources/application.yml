# Configuração comum a todos os profiles. Valores sensíveis e de máquina vêm do `.env` na raiz
# (plan D-43): o Spring importa o arquivo como properties; o Docker Compose lê o mesmo arquivo.
spring:
  application:
    name: cuida-mais
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cuida}}
    username: ${POSTGRES_USER:cuida}
    password: ${POSTGRES_PASSWORD:cuida}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é do Flyway (D-06); o Hibernate só confere
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  jackson:
    time-zone: America/Sao_Paulo   # exibição (Constitution §5); armazenamento em UTC

  servlet:
    multipart:
      # T-031 (D-30): maior que o limite de negócio de 5 MB de propósito — o 413 "oficial" é
      # decidido pelo ElderService (PhotoTooLargeException, corpo Problem), não por este limite
      # genérico do Spring (que devolveria um erro sem o formato certo antes de chegar ao
      # controller). Este valor só existe como rede de segurança (GlobalExceptionHandler) contra
      # um upload absurdamente grande.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # D-18/D-32/contrato: `servers: [{url: /api/v1}]` no openapi.yaml. Configurado uma única vez
    # aqui para que toda rota nasça no lugar certo sem prefixar cada @RequestMapping (T-020).
    context-path: /api/v1

app:
  mail:
    from: ${MAIL_FROM:Cuida+ <nao-responda@cuidamais.local>}
  storage:
    # T-031 (D-30): diretório onde cada foto de idoso é gravada como um arquivo próprio
    # ({@code ElderPhotoStorage}); o banco guarda só o caminho, nunca os bytes. Não é segredo,
    # só um caminho de disco — ainda assim configurável por ambiente (ex. um volume montado em
    # produção), nunca fixo no código.
    elder-photos-dir: ${ELDER_PHOTOS_DIR:./data/elder-photos}
  jwt:
    # T-021 (D-11): segredo HMAC do access token (HS256, mínimo 32 bytes). Sem valor padrão aqui
    # de propósito (regra do projeto: nenhum segredo, nem "só de dev", fica commitado) — dev usa
    # o `.env` local (ver .env.example); o profile test define o seu próprio em
    # application-test.yml; produção exige JWT_SECRET real (application-prod.yml, sem padrão).
    secret: ${JWT_SECRET}
  jobs:
    # T-019 (plan D-09, R-06): um único @Scheduled, a cada 5 min, numa instância só; o profile test desliga
    enabled: ${JOBS_ENABLED:true}
    interval: ${JOBS_INTERVAL:PT5M}   # Duration ISO-8601 (fixedDelay)
